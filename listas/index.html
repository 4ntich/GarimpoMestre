<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Listas de Achados · Garimpo Mestre</title>
  <meta name="description" content="Todas as listas de produtos garimpados no Mercado Livre pelo @garimpo.mestre.">
  <meta name="theme-color" content="#0b0d12">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Listas de Achados · Garimpo Mestre">
  <meta property="og:description" content="Produtos garimpados no Mercado Livre, separados em listas. Escolha a sua!">
  <meta property="og:image" content="https://4ntich.github.io/GarimpoMestre/assets/og-garimpo.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="../assets/avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="../assets/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d12;
      --card: #14171f;
      --line: #262a35;
      --text: #f5f6f8;
      --muted: #9aa0ad;
      --red-1: #ff6b6b;
      --red-2: #e3262b;
      --red-3: #a3121a;
      --green: #25d366;
      --green-2: #1fb457;
      --ml: #ffe600;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(60rem 30rem at 50% -10%, rgba(227,38,43,.14), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    }
    .wrap { width: 100%; max-width: 480px; text-align: center; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600;
      float: left; padding: 6px 0;
    }
    .back svg { width: 16px; height: 16px; }

    .avatar {
      clear: both;
      width: 104px; height: 104px; margin: 34px auto 16px;
      border-radius: 50%; padding: 3px;
      background: conic-gradient(from 210deg, var(--red-1), var(--red-3), #3a0b0e, var(--red-2), var(--red-1));
      box-shadow: 0 0 50px rgba(227,38,43,.25);
    }
    .avatar img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
      border: 3px solid var(--bg); background: #111;
    }

    h1 {
      font-family: Anton, Impact, "Arial Narrow", sans-serif; font-weight: 400;
      text-transform: uppercase; line-height: .95; letter-spacing: .5px;
      font-size: clamp(42px, 13vw, 60px); margin-bottom: 14px;
    }
    h1 .red {
      display: block;
      background: linear-gradient(180deg, var(--red-1), var(--red-2) 60%, var(--red-3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lead { color: #d6d9e0; font-size: 15px; line-height: 1.55; margin-bottom: 18px; }

    .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
      padding: 9px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
    }
    .chip--red { color: var(--red-1); border-color: rgba(227,38,43,.45); background: rgba(227,38,43,.08); }
    .chip--ml { color: #1a1a1a; background: var(--ml); border-color: var(--ml); }

    /* Busca e filtros */
    .search {
      position: relative; display: block; margin-bottom: 12px;
    }
    .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
    .search input {
      width: 100%; padding: 15px 16px 15px 46px;
      border-radius: 14px; border: 1px solid var(--line); background: var(--card);
      color: var(--text); font: inherit; font-size: 16px; outline: none;
    }
    .search input:focus { border-color: rgba(227,38,43,.6); }
    .search input::placeholder { color: #6b7180; }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      flex: none; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .filters button[aria-pressed="true"] { background: var(--red-2); border-color: var(--red-2); color: #fff; }

    /* Cartões */
    .lists { display: grid; gap: 10px; margin-bottom: 26px; text-align: left; }
    .item {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 18px;
      background: var(--card); border: 1px solid var(--line);
      color: var(--text); text-decoration: none;
      transition: border-color .15s ease, transform .15s ease;
      animation: rise .35s ease both;
    }
    .item:hover { border-color: rgba(227,38,43,.55); }
    .item:active { transform: scale(.98); }
    .item__emoji {
      width: 48px; height: 48px; flex: none; border-radius: 14px;
      display: grid; place-items: center; font-size: 24px;
      background: rgba(255,230,0,.1); border: 1px solid rgba(255,230,0,.25);
    }
    .item__body { flex: 1; min-width: 0; }
    .item__title { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
    .item__desc { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
    .item__arrow { width: 18px; height: 18px; color: var(--muted); flex: none; }
    .tag {
      display: inline-block; vertical-align: 2px; margin-left: 6px;
      padding: 2px 7px; border-radius: 6px;
      font-size: 10px; font-weight: 800; letter-spacing: .8px;
      background: var(--red-2); color: #fff;
    }
    .empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }

    .cta {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 18px 22px; border-radius: 999px;
      background: linear-gradient(180deg, #36e07a, var(--green-2));
      color: #fff; text-decoration: none;
      font-weight: 800; font-size: 15px; letter-spacing: .4px; text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(37,211,102,.3), inset 0 1px 0 rgba(255,255,255,.25);
      margin-bottom: 28px;
    }
    .cta svg { width: 24px; height: 24px; flex: none; }
    .cta:active { transform: scale(.97); }

    footer { font-size: 12px; color: #6b7180; line-height: 1.6; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Garimpo Mestre
    </a>

    <div class="avatar"><img src="../assets/avatar.jpg" alt="Logo Garimpo Mestre"></div>

    <h1>Listas de<span class="red">Achados!</span></h1>
    <p class="lead">Produtos que eu garimpei no <strong>Mercado Livre</strong>, separados por tema. Toque numa lista para ver tudo.</p>

    <div class="chips">
      <span class="chip chip--ml">Mercado Livre</span>
      <span class="chip chip--red" id="count">0 listas</span>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></svg>
      <input id="q" type="search" placeholder="Buscar lista…" aria-label="Buscar lista" autocomplete="off">
    </label>

    <div class="filters" id="filters" role="group" aria-label="Categorias" hidden></div>

    <div class="lists" id="lists" aria-live="polite"></div>

    <a class="cta" href="https://whatsapp.com/channel/0029Vb8wNb93WHTTN4qH791I" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.4-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.91-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.42.25-.69.25-1.29.18-1.41-.08-.13-.28-.2-.57-.35m-5.42 7.4h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89a11.82 11.82 0 0 0-3.48-8.41Z"/></svg>
      Entrar no canal VIP
    </a>

    <footer>
      Garimpo Mestre · @garimpo.mestre<br>
      Preços e estoque são definidos pelos vendedores do Mercado Livre e podem mudar.
    </footer>
  </main>

  <script src="../listas.js"></script>
  <script src="../assets/listas-render.js"></script>
  <script>
    (function () {
      var todas = GM.listas();
      var lista = document.getElementById('lists');
      var q = document.getElementById('q');
      var filtros = document.getElementById('filters');
      var categoria = '';

      document.getElementById('count').textContent =
        todas.length + (todas.length === 1 ? ' lista' : ' listas');

      var cats = [];
      todas.forEach(function (l) { if (l.categoria && cats.indexOf(l.categoria) < 0) cats.push(l.categoria); });
      if (cats.length > 1) {
        filtros.hidden = false;
        [''].concat(cats).forEach(function (c) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = c || 'Todas';
          b.setAttribute('aria-pressed', c === '' ? 'true' : 'false');
          b.onclick = function () {
            categoria = c;
            filtros.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
            render();
          };
          filtros.appendChild(b);
        });
      }

      function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

      function render() {
        var termo = norm(q.value.trim());
        var vis = todas.filter(function (l) {
          if (categoria && l.categoria !== categoria) return false;
          return !termo || norm(l.titulo + ' ' + (l.descricao || '') + ' ' + (l.categoria || '')).indexOf(termo) >= 0;
        });
        GM.desenhar(lista, vis, todas[0]);
        if (!vis.length) {
          var p = document.createElement('p');
          p.className = 'empty';
          p.textContent = todas.length ? 'Nenhuma lista encontrada.' : 'As listas aparecem aqui em breve!';
          lista.appendChild(p);
        }
      }
      q.addEventListener('input', render);
      render();
    })();
  </script>
</body>
</html>
